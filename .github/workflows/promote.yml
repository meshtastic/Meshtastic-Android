name: Promote Release

on:
  workflow_call:
    inputs:
      base_version:
        description: 'The base version for the release (e.g., 2.3.0)'
        required: true
        type: string
      tag_name:
        description: 'The tag that triggered the release'
        required: true
        type: string
      release_name:
        description: 'The desired name for the GitHub release'
        required: true
        type: string
      final_tag:
        description: 'The final tag for the release'
        required: true
        type: string
      commit_sha:
        description: 'The commit SHA to tag'
        required: false
        type: string
      channel:
        description: 'The channel to promote to'
        required: true
        type: string
      from_channel:
        description: 'The channel to promote from'
        required: true
        type: string
    secrets:
      GSERVICES:
        required: true
      KEYSTORE:
        required: true
      KEYSTORE_FILENAME:
        required: true
      KEYSTORE_PROPERTIES:
        required: true
      DATADOG_APPLICATION_ID:
        required: true
      DATADOG_CLIENT_TOKEN:
        required: true
      GOOGLE_MAPS_API_KEY:
        required: true
      GOOGLE_PLAY_JSON_KEY:
        required: true
      GRADLE_ENCRYPTION_KEY:
        required: true
      DISCORD_WEBHOOK_ANDROID:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false

# Never cancel a promotion mid-flight: being killed between the Play edit
# commit and the GitHub release/tag update leaves the two disagreeing. The
# caller's queue-only concurrency serializes dispatches; this group (keyed by
# channel + tag) is a second line of defense that queues rather than cancels.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.channel }}-${{ inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
  attestations: write

jobs:
  prepare-build-info:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    outputs:
      APP_VERSION_NAME: ${{ steps.prep_version.outputs.APP_VERSION_NAME }}
      APP_VERSION_CODE: ${{ steps.calculate_version_code.outputs.versionCode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || inputs.tag_name }}
          fetch-depth: 0
          submodules: 'recursive'

      - name: Prep APP_VERSION_NAME
        id: prep_version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION_NAME=$(echo "$INPUT_TAG_NAME" | sed 's/-.*//' | sed 's/v//')
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Parsed Version: $VERSION_NAME"

      - name: Extract VERSION_CODE_OFFSET from config.properties
        id: get_version_code_offset
        run: |
          OFFSET=$(grep '^VERSION_CODE_OFFSET=' config.properties | cut -d'=' -f2)
          echo "VERSION_CODE_OFFSET=$OFFSET" >> "$GITHUB_OUTPUT"

      - name: Calculate Version Code from Git Commit Count
        id: calculate_version_code
        env:
          VERSION_CODE_OFFSET: ${{ steps.get_version_code_offset.outputs.VERSION_CODE_OFFSET }}
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if ! [[ "$VERSION_CODE_OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error::VERSION_CODE_OFFSET from config.properties is not numeric: '$VERSION_CODE_OFFSET'"
            exit 1
          fi
          VERSION_CODE=$((COMMIT_COUNT + VERSION_CODE_OFFSET))
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        shell: bash

  promote-release:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    needs: [ prepare-build-info ]
    outputs:
      already_on_track: ${{ steps.preflight.outputs.already_on_track }}
      screenshots: ${{ steps.screenshots.outputs.found }}
      listing: ${{ steps.listing.outcome }}
    env:
      FROM_TRACK: ${{ inputs.from_channel == 'closed' && 'NewAlpha' || (inputs.from_channel == 'open' && 'beta' || 'internal') }}
      TO_TRACK: ${{ inputs.channel == 'closed' && 'NewAlpha' || (inputs.channel == 'open' && 'beta' || 'production') }}
      USER_FRACTION: ${{ (inputs.channel == 'production' && '0.1') || (inputs.channel == 'open' && '0.5') || '1.0' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || inputs.tag_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Decode Play Store credentials
        run: echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > fastlane/play-store-credentials.json

      # A re-dispatched promotion whose versionCode is already live on the
      # target track must no-op: every redundant `supply` commit creates a new
      # Play submission, and each submission cancels + restarts any review in
      # flight (this reset the v2.8.0 review clock repeatedly, Jul 2026).
      # Fail-open — a preflight error proceeds to supply, which uses the same
      # credentials and will surface any real failure.
      # The main checkout above is at the release tag, which predates this
      # script — fetch it from the caller's commit instead, so script and
      # workflow always move in lockstep. This is a local reusable-workflow
      # call (`uses: ./.github/workflows/promote.yml`), so promote.yml is
      # loaded from that same commit.
      #
      # Must NOT be a release input: any tag cut before this landed has no
      # scripts/ entry, and a missing script exits 127 at the step level,
      # bypassing the script's own fail-open path and hard-failing the
      # promotion. workflow_sha is no better — the github context in a called
      # reusable workflow is caller-associated, so it resolves to the caller's
      # workflow too. A cross-repo caller would need explicit repo+ref inputs.
      - name: Checkout preflight script from caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .workflow-ref
          sparse-checkout: scripts

      - name: Preflight — is this versionCode already on the target track?
        id: preflight
        env:
          VERSION_CODE: ${{ needs.prepare-build-info.outputs.APP_VERSION_CODE }}
        run: |
          PKG=$(grep '^APPLICATION_ID=' config.properties | cut -d'=' -f2)
          bash .workflow-ref/scripts/play-track-preflight.sh \
            fastlane/play-store-credentials.json "$PKG" "$TO_TRACK" "$VERSION_CODE"

      # --version_code pins release selection. Without it supply picks the
      # source release by status (default "completed"), so a staged inProgress
      # rollout on the source track silently promotes the OLD release instead.
      # Changelogs are not skipped: with --track_promote_to, supply writes each
      # locale's changelogs/default.txt (rendered from metainfo.xml by
      # scripts/sync-play-changelog.py, translated by Crowdin) onto the promoted
      # release in the same edit, so the Play "What's new" is never empty.
      - name: Promote to next channel
        if: ${{ steps.preflight.outputs.already_on_track != 'true' }}
        env:
          VERSION_CODE: ${{ needs.prepare-build-info.outputs.APP_VERSION_CODE }}
        run: |
          bundle exec fastlane supply \
            --track "$FROM_TRACK" \
            --track_promote_to "$TO_TRACK" \
            --version_code "$VERSION_CODE" \
            --rollout "$USER_FRACTION" \
            --changes_not_sent_for_review true \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

      # supply exits 0 even when its edit changed nothing, so a promotion only
      # counts once the destination track is seen holding this versionCode.
      - name: Verify versionCode landed on the target track
        if: ${{ steps.preflight.outputs.already_on_track != 'true' }}
        env:
          VERSION_CODE: ${{ needs.prepare-build-info.outputs.APP_VERSION_CODE }}
        run: |
          PKG=$(grep '^APPLICATION_ID=' config.properties | cut -d'=' -f2)
          bash .workflow-ref/scripts/play-track-preflight.sh \
            fastlane/play-store-credentials.json "$PKG" "$TO_TRACK" "$VERSION_CODE" verify

      # The listing is the tag's text for every locale plus the screenshots the
      # internal cut rendered and attached to the release. Without the attachment
      # the committed set goes up instead, and the checklist says so.
      # An absent asset (a tag cut before the render job existed) falls back to
      # the committed set. A present asset that fails to download is an error,
      # and the listing step stays out rather than publish the wrong images.
      - name: Fetch the rendered store screenshots
        id: screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name }}
        run: |
          ASSET=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("store-listing-screenshots-"))' | head -1)
          if [[ -z "$ASSET" ]]; then
            echo "::warning::No rendered screenshots attached to $TAG; the listing keeps the committed set."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP/shots"
          unzip -qo "$RUNNER_TEMP/shots/$ASSET" -d fastlane/metadata/android/en-US/images
          echo "found=true" >> "$GITHUB_OUTPUT"

      # A dry run on the testing tracks, so a bad locale or image dimension fails
      # here and not on production, where the edit is committed. Held as "changes
      # not sent for review" either way; Play does not restart a release review
      # for it. Soft-fail: the track promotion above already happened.
      - name: Publish the Play listing
        id: listing
        if: ${{ steps.screenshots.outcome == 'success' }}
        continue-on-error: true
        env:
          VALIDATE_ONLY: ${{ inputs.channel != 'production' && 'true' || 'false' }}
        run: |
          python3 .workflow-ref/scripts/check-store-metadata.py
          bundle exec fastlane play_listing validate_only:"$VALIDATE_ONLY"

      - name: Clean up credentials
        if: always()
        run: rm -f fastlane/play-store-credentials.json

  update-github-release:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    needs: [ prepare-build-info, promote-release ]
    # actions: write is scoped here — only this job's publish-workflow
    # dispatch needs it, and the other jobs must not get it. Job-level
    # permissions replace the workflow-level block, so the full set this
    # job uses is listed.
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || inputs.tag_name }}
          fetch-depth: 0
          submodules: 'recursive'

      # Same reasoning as promote-release: scripts come from the caller's commit,
      # not the tag, so a tag cut before a script landed still gets it.
      - name: Checkout release scripts from caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .workflow-ref
          sparse-checkout: scripts

      - name: Push Git Tag on Success
        if: ${{ inputs.commit_sha != '' }}
        run: |
          git tag ${{ inputs.final_tag }} ${{ inputs.commit_sha }}
          git push origin ${{ inputs.final_tag }}

      - name: Update GitHub Release with gh CLI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit ${{ inputs.tag_name }} \
            --tag ${{ inputs.final_tag }} \
            --title "${{ inputs.release_name }} (${{ needs.prepare-build-info.outputs.APP_VERSION_CODE }})" \
            --draft=false \
            --prerelease=${{ inputs.channel != 'production' }}

      # The draft's notes were generated at the internal cut and cover only the
      # PRs since the previous published pre-release. A production release is
      # what users read, so regenerate its notes over the whole range since the
      # previous production tag, highlights first. The raw notes are kept for
      # the CHANGELOG.md stamp below. Soft-fail: the drafted notes stay in place
      # when this step cannot produce better ones.
      - name: Rewrite release notes for the full range
        id: notes
        if: ${{ inputs.channel == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.final_tag }}
          VERSION: ${{ inputs.base_version }}
          REPO: ${{ github.repository }}
        run: |
          PREV_PROD=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${VERSION}$" | head -1)
          if [[ -z "$PREV_PROD" ]]; then
            echo "::warning::No previous production tag found; leaving the drafted release notes in place."
            exit 1
          fi
          echo "Previous production tag: $PREV_PROD"

          gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$(git rev-parse HEAD)" \
            -f previous_tag_name="$PREV_PROD" \
            --jq '.body' > "$RUNNER_TEMP/notes-raw.md"

          cp "$RUNNER_TEMP/notes-raw.md" "$RUNNER_TEMP/release-notes.md"
          python3 .workflow-ref/scripts/release-highlights.py \
            desktopApp/packaging/linux/org.meshtastic.MeshtasticDesktop.metainfo.xml \
            config.properties \
            "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      # The edit above is made with GITHUB_TOKEN, and GITHUB_TOKEN-caused
      # events never start workflow runs — winget-publish.yml's `released`
      # trigger will not fire from it. workflow_dispatch is exempt from that
      # suppression, so dispatch it explicitly. Soft-fail: a winget hiccup
      # must not block the changelog stamp or Discord notification.
      - name: Dispatch winget publish
        id: winget
        if: ${{ inputs.channel == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.final_tag }}
        run: gh workflow run winget-publish.yml --ref main -f "tag=$TAG"

      # Same GITHUB_TOKEN-suppression story as the winget dispatch above.
      - name: Dispatch Microsoft Store publish
        id: msstore
        if: ${{ inputs.channel == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.final_tag }}
        run: gh workflow run msstore-publish.yml --ref main -f "tag=$TAG"

      # docs-release.yml's tag trigger never fires either: the release edit
      # above creates the tag with GITHUB_TOKEN. Run it on the tag ref, which
      # publishes /vX.Y.Z/ (plus the root and /api/ for production) or the
      # /vX.Y.Z-open.N/ snapshot. The tag appears a moment after the undraft.
      - name: Dispatch docs release
        id: docs
        if: ${{ inputs.channel != 'internal' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.final_tag }}
          REPO: ${{ github.repository }}
        run: |
          for _ in 1 2 3 4 5 6; do
            gh api "repos/${REPO}/git/ref/tags/${TAG}" --silent && break
            sleep 10
          done
          gh workflow run docs-release.yml --ref "$TAG"

      - name: Stamp CHANGELOG.md for release
        id: stamp
        if: ${{ inputs.channel == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.base_version }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Checkout CHANGELOG.md from main (we're on a tag checkout)
          git fetch origin main
          git checkout -b "changelog/v${VERSION}" origin/main

          # The full-range notes from the step above, minus the boilerplate.
          # The file is the record whether or not the release edit went
          # through; the checklist reports that edit. No file means generation
          # failed, and the section says so instead of stamping empty.
          FLAT_NOTES="*Release notes were not generated; run the Update Changelog workflow.*"
          if [ -s "$RUNNER_TEMP/notes-raw.md" ]; then
            FLAT_NOTES=$(sed '/^<!-- .* -->/d' "$RUNNER_TEMP/notes-raw.md" \
              | sed '/^## What'\''s Changed$/d' \
              | sed '/^\*\*Full Changelog\*\*/d' \
              | sed '/./,$!d' \
              | sed -e :a -e '/^\n*$/{$d;N;ba}')
          fi

          # Build the versioned section and reset unreleased
          python3 -c "
          import sys
          version, date, notes = sys.argv[1], sys.argv[2], sys.argv[3]
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()

          us = '<!-- UNRELEASED_START -->'
          ue = '<!-- UNRELEASED_END -->'
          rs = '<!-- RELEASED_START -->'

          start = content.find(us)
          end = content.find(ue)
          rstart = content.find(rs)

          if start == -1 or end == -1 or rstart == -1:
              print('Markers not found in CHANGELOG.md')
              sys.exit(1)

          versioned = f'## [{version}] - {date}\n\n{notes}'
          fresh = '## [Unreleased]\n\n*No changes yet.*'

          new_content = (
              content[:start + len(us)] + '\n' + fresh + '\n'
              + content[end:rstart + len(rs)] + '\n\n' + versioned + '\n'
              + content[rstart + len(rs):]
          )

          with open('CHANGELOG.md', 'w') as f:
              f.write(new_content)
          " "$VERSION" "$DATE" "$FLAT_NOTES"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || {
            BRANCH="automation/changelog-v${VERSION}"
            git checkout -B "$BRANCH"
            git commit -m "docs: release CHANGELOG.md for v${VERSION}"
            git push origin "$BRANCH" --force

            PR_URL=$(gh pr create \
              --title "docs: release CHANGELOG.md for v${VERSION}" \
              --body "Automated changelog stamp for production release v${VERSION}." \
              --head "$BRANCH" \
              --base main \
              --label "automation" \
              --label "skip-changelog")
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

            # Post required commit status so the PR isn't blocked
            COMMIT_SHA=$(git rev-parse HEAD)
            gh api "repos/${{ github.repository }}/statuses/${COMMIT_SHA}" \
              -f state="success" \
              -f context="Check Workflow Status" \
              -f description="Skipped — changelog-only PR"
          }

      # F-Droid and IzzyOnDroid read fastlane/ straight from git, so the committed
      # set follows what production shipped: the rendered screenshots come back from
      # the release into a bot PR that merges itself. The Flathub metainfo reads the
      # release assets directly and needs nothing here. Nothing to open when the
      # files already match.
      - name: Refresh the committed store screenshots
        id: shots_pr
        if: ${{ inputs.channel == 'production' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.final_tag }}
          VERSION: ${{ inputs.base_version }}
          REPO: ${{ github.repository }}
        run: |
          ASSET=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(startswith("store-listing-screenshots-"))' | head -1)
          if [[ -z "$ASSET" ]]; then
            echo "::warning::No rendered screenshots attached to $TAG; the committed set stays."
            echo "refreshed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --pattern "$ASSET" --pattern 'meshtastic-desktop-*.png' --dir "$RUNNER_TEMP/shots"
          git fetch origin main
          BRANCH="automation/store-screenshots-v${VERSION}"
          git checkout -B "$BRANCH" origin/main
          unzip -qo "$RUNNER_TEMP"/shots/store-listing-screenshots-*.zip -d fastlane/metadata/android/en-US/images
          cp "$RUNNER_TEMP"/shots/meshtastic-desktop-*.png desktopApp/packaging/linux/screenshots/
          git add fastlane/metadata/android/en-US/images desktopApp/packaging/linux/screenshots
          if git diff --cached --quiet; then
            echo "Committed screenshots already match v${VERSION}."
            echo "refreshed=match" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(store): refresh the committed screenshots from v${VERSION}"
          git push origin "$BRANCH" --force
          PR_URL=$(gh pr create \
            --title "chore(store): refresh the committed screenshots from v${VERSION}" \
            --body "The screenshots rendered for the v${VERSION} release, so the fastlane tree F-Droid reads matches what shipped." \
            --head "$BRANCH" \
            --base main \
            --label "automation" \
            --label "skip-changelog")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          # GITHUB_TOKEN pushes start no workflows: post the status the queue
          # requires, as the changelog stamp does, then let the queue take it.
          gh api "repos/${REPO}/statuses/$(git rev-parse HEAD)" \
            -f state="success" \
            -f context="Check Workflow Status" \
            -f description="Skipped — screenshot-only PR"
          PR_ID=$(gh pr view "$PR_URL" --json id --jq .id)
          QUERY=$(cat <<'GQL'
          mutation($id: ID!) {
            enablePullRequestAutoMerge(input: { pullRequestId: $id }) {
              pullRequest { number autoMergeRequest { enabledAt } }
            }
          }
          GQL
          )
          gh api graphql -f query="$QUERY" -F id="$PR_ID" || gh pr merge "$PR_URL"

      # One place to read what this promotion did, what it dispatched, and what
      # is still done by hand. The store dispatches report the dispatch only;
      # each store workflow skips inside itself until its secrets exist. The
      # hand-done list stays out of the Discord post, which is an announcement.
      - name: Release checklist
        if: ${{ always() }}
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ inputs.final_tag }}
          REPO: ${{ github.repository }}
          ALREADY_ON_TRACK: ${{ needs.promote-release.outputs.already_on_track }}
          SCREENSHOTS: ${{ needs.promote-release.outputs.screenshots }}
          LISTING: ${{ needs.promote-release.outputs.listing }}
          SHOTS_PR: ${{ steps.shots_pr.outputs.pr_url }}
          SHOTS_PR_OUTCOME: ${{ steps.shots_pr.outcome }}
          SHOTS_REFRESHED: ${{ steps.shots_pr.outputs.refreshed }}
          RELEASE: ${{ steps.release.outcome }}
          NOTES: ${{ steps.notes.outcome }}
          DOCS: ${{ steps.docs.outcome }}
          WINGET: ${{ steps.winget.outcome }}
          MSSTORE: ${{ steps.msstore.outcome }}
          STAMP: ${{ steps.stamp.outcome }}
          STAMP_PR: ${{ steps.stamp.outputs.pr_url }}
        run: |
          row() { printf '| %s | %s |\n' "$1" "$2"; }
          {
            echo "## Release checklist: ${TAG} (${CHANNEL})"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            if [[ "$ALREADY_ON_TRACK" == "true" ]]; then
              row "Play promotion" "no-op, versionCode already on the track"
            else
              row "Play promotion" "done, changelogs uploaded"
            fi
            row "GitHub release" "$RELEASE - https://github.com/${REPO}/releases/tag/${TAG}"
            if [[ "$SCREENSHOTS" == "true" ]]; then
              row "Store screenshots" "rendered set from the release"
            else
              row "Store screenshots" "none attached, committed set used"
            fi
            if [[ "$CHANNEL" == "production" ]]; then
              row "Play listing published" "$LISTING"
            else
              row "Play listing validated (dry run)" "$LISTING"
            fi
            row "Docs Release dispatched" "$DOCS"
            if [[ "$CHANNEL" == "production" ]]; then
              if [[ -n "$SHOTS_PR" ]]; then
                row "Committed screenshots refresh PR" "$SHOTS_PR"
              elif [[ "$SHOTS_PR_OUTCOME" == "success" ]]; then
                row "Committed screenshots refresh PR" "none needed (${SHOTS_REFRESHED:-no change})"
              else
                row "Committed screenshots refresh PR" "$SHOTS_PR_OUTCOME"
              fi
              row "Release notes rewritten (full range)" "$NOTES"
              row "CHANGELOG.md stamp" "$STAMP ${STAMP_PR:+- $STAMP_PR}"
              row "winget dispatched" "$WINGET"
              row "Microsoft Store dispatched" "$MSSTORE"
              echo
              echo "Still by hand:"
              echo "- Play Console: the production rollout is staged; complete it there."
              echo "- Flathub: bump flathub/org.meshtastic.MeshtasticDesktop (tag, commit, gradle zip and sha256, flatpak-sources.json)."
              echo "- Post-Release Cleanup: dispatch with confirm_deletion=true once Docs Release has published /${TAG}/."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: ${{ inputs.channel != 'internal' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ANDROID }}
          VERSION: ${{ inputs.final_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "No Discord webhook provided. Skipping notification."
            exit 0
          fi

          # Determine Track Name for Display
          if [ "$CHANNEL" == "closed" ]; then TRACK="Alpha (Closed)"; fi
          if [ "$CHANNEL" == "open" ]; then TRACK="Beta (Open)"; fi
          if [ "$CHANNEL" == "production" ]; then TRACK="Production"; fi

          # Construct JSON Payload
          PAYLOAD=$(cat <<EOF
          {
            "content": null,
            "embeds": [
              {
                "title": "🚀 New Android Release: $VERSION",
                "description": "A new build has been promoted to the **$TRACK** track.",
                "color": 5763719,
                "fields": [
                  {
                    "name": "Track",
                    "value": "$TRACK",
                    "inline": true
                  },
                  {
                    "name": "Version",
                    "value": "$VERSION",
                    "inline": true
                  }
                ],
                "url": "https://github.com/meshtastic/Meshtastic-Android/releases/tag/$VERSION"
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

  # Runs in-workflow rather than on `release: published` because the undraft above
  # uses github.token, whose events never trigger other workflows. Once the cask is
  # promoted to homebrew/cask, replace the tap PR with `brew bump-cask-pr`.
  update-homebrew-cask:
    if: ${{ inputs.channel == 'production' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    needs: [ update-github-release ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || inputs.tag_name }}

      - name: Render cask and open PR against meshtastic/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.final_tag }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping Homebrew cask update."
            echo "- Homebrew cask: skipped, HOMEBREW_TAP_TOKEN not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Tags cut before the template landed check out without it — skip, don't fail.
          if [[ ! -f .github/homebrew/meshtastic-desktop.rb ]]; then
            echo "::warning::Cask template not present at this tag; skipping Homebrew cask update."
            echo "- Homebrew cask: skipped, no template at this tag" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          VERSION=${TAG#v}
          # GitHub rewrites spaces in asset names to dots:
          # "Meshtastic Desktop-X.dmg" is served as "Meshtastic.Desktop-X.dmg".
          # --retry-all-errors covers the brief 404 window while the undraft propagates.
          curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o /tmp/app.dmg \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Meshtastic.Desktop-${VERSION}.dmg"
          SHA256=$(sha256sum /tmp/app.dmg | cut -d' ' -f1)

          sed -e "s/{{VERSION}}/${VERSION}/" -e "s/{{SHA256}}/${SHA256}/" \
            .github/homebrew/meshtastic-desktop.rb > /tmp/meshtastic-desktop.rb

          # PR (not a direct push to main) so the tap's brew test-bot CI validates the bump.
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/meshtastic/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          BRANCH="meshtastic-desktop-${VERSION}"
          git checkout -b "$BRANCH"
          mkdir -p Casks
          cp /tmp/meshtastic-desktop.rb Casks/meshtastic-desktop.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/meshtastic-desktop.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi
          git commit -m "meshtastic-desktop ${VERSION}"
          git push -fu origin "$BRANCH"
          PR_URL=$(GH_TOKEN="$TAP_TOKEN" gh pr create --repo meshtastic/homebrew-tap \
            --head "$BRANCH" --base main \
            --title "meshtastic-desktop ${VERSION}" \
            --body "Automated cask bump for the ${TAG} production release of [Meshtastic-Android](https://github.com/${{ github.repository }}/releases/tag/${TAG})." \
            || echo "PR already exists for $BRANCH; branch updated.")
          echo "- Homebrew cask: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
