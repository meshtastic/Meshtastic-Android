name: Gabagool Radio Build Candidates

on:
  workflow_dispatch:
  push:
    branches: [main, "branding/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Use the Android SDK already installed on GitHub's Ubuntu image.
      # setup-android@v3 currently fails while installing the obsolete 'tools' package.
      - name: Confirm Android SDK
        run: test -d "$ANDROID_HOME" && echo "SDK available at $ANDROID_HOME"
      - name: Build Android F-Droid debug APK
        run: ./gradlew :androidApp:assembleFdroidDebug --stacktrace
      - name: Verify Android APK exists
        run: |
          find androidApp/build/outputs/apk/fdroid/debug -name '*.apk' -type f -size +1M | grep -q .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gabagool-android-debug
          path: androidApp/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Intel macOS DMG
        run: ./gradlew :desktopApp:packageDmg --stacktrace
      - name: Verify Intel macOS DMG exists
        run: |
          find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' -type f -size +1M | grep -q .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gabagool-macos-intel-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
