name: Scheduled Updates (Firmware, Hardware, Translations)

on:
  schedule:
    # Cheap (curl + Crowdin + PR; Gradle only when the protobufs pin moves). The emulator and
    # graph work lives in scheduled-baseline.yml.
    - cron: '17 */6 * * *'
  # A protobufs pin change on main regenerates the schema strings without waiting for the cron.
  push:
    branches: [main]
    paths: [gradle/libs.versions.toml]
  workflow_dispatch:       # Allow manual triggering

# Cron, push and manual dispatch must never stack: overlapping runs race on the
# scheduled-updates branch force-push. Later runs queue (at most one pending).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_assets:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.repository == 'meshtastic/Meshtastic-Android'
    permissions:
      contents: write      # To commit files and push branches
      pull-requests: write # To create pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CROWDIN_GITHUB_TOKEN }}

      - name: Update firmware releases list
        id: firmware
        run: scripts/scheduled-updates/assets.sh fetch firmware

      - name: Update hardware list
        id: hardware
        run: scripts/scheduled-updates/assets.sh fetch hardware

      - name: Update event firmware metadata
        id: event_firmware
        run: scripts/scheduled-updates/assets.sh fetch event_firmware

      - name: Update device links list
        id: device_links
        run: scripts/scheduled-updates/assets.sh fetch device_links

      - name: Update bootloader OTA quirks
        id: bootloader_quirks
        run: scripts/scheduled-updates/assets.sh fetch bootloader_quirks

      - name: Update maintenance UF2 manifest
        id: maintenance_uf2
        run: scripts/scheduled-updates/assets.sh fetch maintenance_uf2

      - name: Refresh Obtainium configs and deep links
        id: obtainium
        env:
          # Only for the API rate limit; the releases endpoint is public.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Regenerates the deep-link tables and import files, then probes the live
          # releases to confirm every apkFilterRegEx still matches published assets.
          # A non-zero exit means an asset was renamed and the configs are broken —
          # surface it as an error and skip the update rather than committing configs
          # that resolve to nothing. Unreachable API exits 0 without touching files.
          if python3 obtainium/generate-links.py --refresh; then
            if git diff --quiet -- README.md docs/en/developer/test-builds.md obtainium; then
              echo "No changes detected in Obtainium configs."
              echo "status=unchanged" >> "$GITHUB_OUTPUT"
            else
              echo "Obtainium configs or channel status changed."
              echo "status=updated" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Obtainium config refresh failed — see the error above."
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "detail=an apkFilterRegEx no longer matches the published release assets" >> "$GITHUB_OUTPUT"
            git checkout -- README.md docs/en/developer/test-builds.md obtainium
          fi

      # values/schema_strings.xml is generated from the org.meshtastic:protobufs pin and records which one. Gradle
      # runs here only when main's pin has moved past the recorded one and the scheduled-updates branch does not
      # already carry the file for that pin, so the job stays cheap between bumps and while the PR waits;
      # the regenerated English goes up to Crowdin in the step below and rides this PR with the translations.
      - name: Check whether the schema strings lag the protobufs pin
        id: schema_pin
        run: |
          xml=core/resources/src/commonMain/composeResources/values/schema_strings.xml
          strings=core/resources/src/commonMain/composeResources/values/strings.xml
          recorded_pin() { sed -n 's/.*from org\.meshtastic:protobufs \([^ ]*\)\..*/\1/p' | head -n1; }
          xml_header() { sed '/<resources>/q'; }
          catalog=$(sed -n 's/^meshtastic-protobufs = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          recorded=$(recorded_pin < "$xml")
          echo "catalog=$catalog" >> "$GITHUB_OUTPUT"
          echo "recorded=$recorded" >> "$GITHUB_OUTPUT"
          if [ "$catalog" = "$recorded" ]; then
            echo "schema strings already reflect protobufs $catalog"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema strings reflect protobufs $recorded, catalog has $catalog"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            branch_xml="$RUNNER_TEMP/scheduled-updates.schema_strings.xml"
            # The file is a function of the pin, the generator in schema-strings/ and the strings.xml header it
            # borrows, so a copy built before either of the last two changed on main is regenerated.
            if git fetch --no-tags --depth=1 --quiet origin scheduled-updates 2>/dev/null \
              && git show "FETCH_HEAD:$xml" > "$branch_xml" 2>/dev/null \
              && [ "$(recorded_pin < "$branch_xml")" = "$catalog" ] \
              && [ "$(git rev-parse FETCH_HEAD:schema-strings 2>/dev/null)" = "$(git rev-parse HEAD:schema-strings)" ] \
              && [ "$(xml_header < "$branch_xml")" = "$(xml_header < "$strings")" ]; then
              echo "scheduled-updates already carries the schema strings for protobufs $catalog; reusing them"
              echo "reuse=$branch_xml" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Gradle Setup
        if: steps.schema_pin.outputs.changed == 'true' && steps.schema_pin.outputs.reuse == ''
        uses: ./.github/actions/gradle-setup
        with:
          gradle_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          develocity_access_key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          job_summary_pr_comment: 'never'
          cache_read_only: 'true'
          cache_configuration_cache: 'false'
          cache_robolectric: 'false'

      - name: Regenerate the schema strings
        id: schema_strings
        if: steps.schema_pin.outputs.changed == 'true'
        env:
          RECORDED: ${{ steps.schema_pin.outputs.recorded }}
          CATALOG: ${{ steps.schema_pin.outputs.catalog }}
          REUSE: ${{ steps.schema_pin.outputs.reuse }}
        run: |
          xml=core/resources/src/commonMain/composeResources/values/schema_strings.xml
          cp "$xml" /tmp/schema_strings.before.xml
          # Only the xml is taken from the branch: strings-index.txt also lists main's hand-written strings,
          # which may have moved since the branch was built, so sort-strings.py rebuilds it either way.
          if [ -n "$REUSE" ]; then
            regenerate=(cp "$REUSE" "$xml")
          else
            regenerate=(./gradlew :schema-strings:sync -Pci=true)
          fi
          if "${regenerate[@]}" && python3 scripts/sort-strings.py; then
            git clone --filter=blob:none --quiet https://github.com/meshtastic/protobufs.git /tmp/protobufs
            python3 scripts/protobufs-bump-summary.py "$RECORDED" "$CATALOG" --protobufs /tmp/protobufs \
              --before /tmp/schema_strings.before.xml --after "$xml" > /tmp/schema-summary.md || true
            cat /tmp/schema-summary.md >> "$GITHUB_STEP_SUMMARY"
            detail=$(sed -n 's/^\*\*\([0-9]* [a-z]* strings\)\*\*.*/\1/p' /tmp/schema-summary.md | paste -sd, - | sed 's/,/, /g')
            echo "status=updated" >> "$GITHUB_OUTPUT"
            echo "detail=${detail:-no string changes}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Schema strings sync failed — see the error above."
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "detail=./gradlew :schema-strings:sync failed for protobufs $CATALOG" >> "$GITHUB_OUTPUT"
            git checkout -- "$xml" .skills/compose-ui/strings-index.txt
          fi

      - name: Sync with Crowdin
        uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3
        with:
          base_url: 'https://meshtastic.crowdin.com/api/v2'
          config: 'crowdin.yml'
          crowdin_branch_name: 'main'
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: false
          commit_message: 'chore(l10n): New Crowdin Translations from scheduled update'
          push_translations: false
          push_sources: false
          localization_branch_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Fix file permissions
        run: sudo chown -R "$USER:$USER" .

      # Early warning for store-listing translations just pulled from Crowdin
      # (overlength text, unmapped locale codes, forbidden HTML). Non-blocking on
      # purpose: a hard failure here would abort the job and stop the PR from
      # being created. The hard gate is the same script in pull-request.yml,
      # which runs against the PR this workflow opens.
      - name: Check store metadata
        continue-on-error: true
        run: python3 scripts/check-store-metadata.py

      # Each label fires a labeler run, so a category is labelled only when this run changed it.
      - name: Pick the PR labels
        id: labels
        env:
          FIRMWARE_STATUS: ${{ steps.firmware.outputs.status }}
          EVENT_FIRMWARE_STATUS: ${{ steps.event_firmware.outputs.status }}
          MAINTENANCE_UF2_STATUS: ${{ steps.maintenance_uf2.outputs.status }}
          HARDWARE_STATUS: ${{ steps.hardware.outputs.status }}
          DEVICE_LINKS_STATUS: ${{ steps.device_links.outputs.status }}
          BOOTLOADER_QUIRKS_STATUS: ${{ steps.bootloader_quirks.outputs.status }}
          SCHEMA_STRINGS_STATUS: ${{ steps.schema_strings.outputs.status }}
        run: |
          any_updated() {
            for status in "$@"; do [ "$status" = updated ] && return 0; done
            return 1
          }
          labels=automation
          if any_updated "$FIRMWARE_STATUS" "$EVENT_FIRMWARE_STATUS" "$MAINTENANCE_UF2_STATUS"; then
            labels+=,firmware
          fi
          if any_updated "$HARDWARE_STATUS" "$DEVICE_LINKS_STATUS" "$BOOTLOADER_QUIRKS_STATUS"; then
            labels+=,hardware
          fi
          # Crowdin reports no status, so its downloads are read off the tree: the locale copies, never the English sources.
          translations=$(git status --porcelain --untracked-files=all -- \
            ':(glob)**/composeResources/values-*/**' \
            ':(glob)fastlane/metadata/android/**' ':(exclude,glob)fastlane/metadata/android/en-US/**' \
            ':(glob)docs/**' ':(exclude,glob)docs/en/**')
          if [ -n "$translations" ] || any_updated "$SCHEMA_STRINGS_STATUS"; then
            labels+=,l10n
          fi
          echo "Labels: $labels"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        id: pr_body
        env:
          # Hoisted into env: (not interpolated directly in the script) so no step output can inject shell — see
          # zizmor template-injection. Values are fixed strings today, but detail may carry API text in future.
          FIRMWARE_STATUS: ${{ steps.firmware.outputs.status }}
          FIRMWARE_DETAIL: ${{ steps.firmware.outputs.detail }}
          HARDWARE_STATUS: ${{ steps.hardware.outputs.status }}
          HARDWARE_DETAIL: ${{ steps.hardware.outputs.detail }}
          EVENT_FIRMWARE_STATUS: ${{ steps.event_firmware.outputs.status }}
          EVENT_FIRMWARE_DETAIL: ${{ steps.event_firmware.outputs.detail }}
          DEVICE_LINKS_STATUS: ${{ steps.device_links.outputs.status }}
          DEVICE_LINKS_DETAIL: ${{ steps.device_links.outputs.detail }}
          BOOTLOADER_QUIRKS_STATUS: ${{ steps.bootloader_quirks.outputs.status }}
          BOOTLOADER_QUIRKS_DETAIL: ${{ steps.bootloader_quirks.outputs.detail }}
          MAINTENANCE_UF2_STATUS: ${{ steps.maintenance_uf2.outputs.status }}
          MAINTENANCE_UF2_DETAIL: ${{ steps.maintenance_uf2.outputs.detail }}
          OBTAINIUM_STATUS: ${{ steps.obtainium.outputs.status }}
          OBTAINIUM_DETAIL: ${{ steps.obtainium.outputs.detail }}
          SCHEMA_PIN_CHANGED: ${{ steps.schema_pin.outputs.changed }}
          SCHEMA_PIN_CATALOG: ${{ steps.schema_pin.outputs.catalog }}
          SCHEMA_STRINGS_STATUS: ${{ steps.schema_strings.outputs.status }}
          SCHEMA_STRINGS_DETAIL: ${{ steps.schema_strings.outputs.detail }}
        run: scripts/scheduled-updates/assets.sh body

      # GitHub refuses a push to the head branch of a queued PR (GH006), so a queued PR is left to land.
      # gh pr view --json does not expose isInMergeQueue; GraphQL does.
      # headRefName also matches fork PRs; only one open same-repository PR can exist per head and base.
      - name: Check whether the scheduled PR is in the merge queue
        id: merge_queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          query=$(cat <<'GQL'
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(headRefName: "scheduled-updates", baseRefName: "main", states: OPEN, first: 50) {
                nodes { number isCrossRepository isInMergeQueue }
              }
            }
          }
          GQL
          )
          if ! queued=$(gh api graphql -f query="$query" -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.pullRequests.nodes[] | select(.isInMergeQueue and (.isCrossRepository | not)) | .number'); then
            echo "::warning::Could not read the merge queue state of the scheduled PR; updating it anyway."
            queued=""
          fi
          if [ -n "$queued" ]; then
            echo "::notice::#$queued is in the merge queue; leaving its branch alone until it lands."
            echo "in_queue=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_queue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request if changes occurred
        id: pr
        if: steps.merge_queue.outputs.in_queue != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
          commit-message: |
            chore: Scheduled updates (Firmware, Hardware, Translations)

            Automated updates for:
            - Firmware releases list
            - Device hardware list
            - Event firmware metadata
            - Device links list
            - Crowdin source string uploads
            - Crowdin translation downloads
            - Obtainium deep links and import files
            - Schema strings regenerated from the protobufs pin
          title: 'chore: Scheduled updates (Firmware, Hardware, Translations)'
          body: ${{ steps.pr_body.outputs.content }}
          branch: 'scheduled-updates'
          base: 'main'
          delete-branch: true
          add-paths: |
            androidApp/src/main/assets/firmware_releases.json
            androidApp/src/main/assets/device_hardware.json
            androidApp/src/main/assets/event_firmware.json
            androidApp/src/main/assets/device_links.json
            androidApp/src/main/assets/device_bootloader_ota_quirks.json
            androidApp/src/main/assets/maintenance_uf2.json
            fastlane/metadata/android/**
            **/strings.xml
            **/schema_strings.xml
            .skills/compose-ui/strings-index.txt
            docs/**/*.md
            README.md
            obtainium/**
          labels: ${{ steps.labels.outputs.labels }}

      # "Merge when ready": the merge queue takes the PR once its checks pass.
      # No merge method is passed; the queue sets it. Re-run on every update,
      # since a fresh push can clear a previous request. GitHub refuses the
      # request on a PR that is already mergeable, so that case merges directly.
      # A failure fails the run: the PR exists either way, and a request that
      # cannot be made is something to fix, not to hide.
      - name: Enable auto-merge
        if: ${{ steps.merge_queue.outputs.in_queue != 'true' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated') }}
        env:
          GH_TOKEN: ${{ secrets.CROWDIN_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          PR_ID=$(gh pr view "$PR_NUMBER" --json id --jq .id)
          QUERY=$(cat <<'GQL'
          mutation($id: ID!) {
            enablePullRequestAutoMerge(input: { pullRequestId: $id }) {
              pullRequest { number autoMergeRequest { enabledAt } }
            }
          }
          GQL
          )
          gh api graphql -f query="$QUERY" -F id="$PR_ID" \
            || gh pr merge "$PR_NUMBER"
