name: Submit Dependency Graph

# PR builds can only *generate and upload* a dependency graph: a pull request from a fork gets a
# read-only GITHUB_TOKEN, and submission needs `contents: write`. This workflow runs in the base
# repository's trusted context on completion of Pull Request CI and submits what that run saved.
#
# It never checks out or executes PR code — the only input is the snapshot artifact, downloaded by
# gradle/actions itself.
on:
  workflow_run:
    workflows: ['Pull Request CI']
    types: [completed]

permissions:
  actions: read
  contents: write

# head_branch alone would collide across forks that share a branch name (e.g. two "patch-1"s).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  submit-dependency-graph:
    # conclusion guard: a failed CI run may have no (or a partial) graph; skip rather than submit it.
    if: github.repository == 'meshtastic/Meshtastic-Android' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      # Runs where android-check was skipped (docs-only changes, bot branches) upload no
      # snapshot; download-and-submit would fail red on every such PR without this probe.
      - name: Check the run saved a dependency graph
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("dependency-graph"))] | length' | paste -sd+ | bc)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Download and submit dependency graph
        if: steps.probe.outputs.count != '0'
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: download-and-submit
