name: Gradle Setup
description: Setup Java and Gradle for KMP builds
inputs:
  cache_read_only:
    description: 'Whether the Gradle and Kotlin/Native caches are read-only'
    default: 'true'
  cache_konan:
    description: 'Cache ~/.konan. Only jobs that run Kotlin/Native tasks read it.'
    default: 'false'
  jdk_distribution:
    description: 'JDK distribution (temurin or jetbrains)'
    default: 'temurin'
  install_jetbrains_jdk:
    description: |
      Also install JetBrains JDK 25 with setup-java. Gradle detects it through ~/.m2/toolchains.xml;
      foojay lists no JBR 25, so without this Gradle finds one only in a restored toolchain cache.
      Every job needs it: desktopApp resolves its JBR launcher while the build is configured.
      The Linux release installers bundle this JBR and flatpak-sources records no foojay download.
    default: 'true'
  gradle_encryption_key:
    description: 'Encryption key for Gradle remote cache'
    required: false
  develocity_access_key:
    description: 'Access key for the OSS Community Develocity Instance (Build Scan publishing and remote cache writes)'
    required: false
  job_summary_pr_comment:
    description: |
      Job summary as a PR comment: never | always | on-failure. Needs `pull-requests: write`;
      no-ops on fork PRs (read-only token). Forced to `never` on Windows — see below.
    default: 'never'
  dependency_graph:
    description: |
      Dependency graph mode: disabled | generate | generate-and-submit | generate-and-upload |
      download-and-submit. Submit needs `contents: write`.
    default: 'disabled'
runs:
  using: composite
  steps:
    - name: Copy CI Gradle properties
      shell: bash
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '25'
        distribution: ${{ inputs.jdk_distribution }}
        token: ${{ github.token }}

    # Fatal: no build can configure without JBR. set-default: false keeps the Temurin above as the JVM
    # running Gradle; toolchains.xml still lists JBR.
    - name: Set up JetBrains JDK 25
      if: inputs.install_jetbrains_jdk == 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '25'
        distribution: 'jetbrains'
        check-latest: false
        set-default: false
        token: ${{ github.token }}

    # ~/.konan and ~/.m2 sit outside the Gradle User Home, so setup-gradle does not cache them.
    # A save step here would run before ./gradlew, so writers rely on actions/cache's end-of-job save.
    - name: Read the Kotlin version
      if: inputs.cache_konan == 'true'
      id: kotlin
      shell: bash
      run: |
        version=$(awk -F'"' '/^kotlin *= *"/ { print $2; exit }' gradle/libs.versions.toml)
        if [ -z "$version" ]; then
          echo "::error file=gradle/libs.versions.toml::no kotlin version entry"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore the Kotlin/Native toolchain
      if: inputs.cache_konan == 'true' && inputs.cache_read_only == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
        restore-keys: |
          konan-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache the Kotlin/Native toolchain
      if: inputs.cache_konan == 'true' && inputs.cache_read_only != 'true'
      id: konan
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
        restore-keys: |
          konan-${{ runner.os }}-${{ runner.arch }}-

    # A restore-keys match brings the previous Kotlin's bundle along; without this the saved entry grows every bump.
    - name: Drop other Kotlin/Native bundles before the save
      if: inputs.cache_konan == 'true' && inputs.cache_read_only != 'true' && steps.konan.outputs.cache-hit != 'true'
      shell: bash
      env:
        KOTLIN_VERSION: ${{ steps.kotlin.outputs.version }}
      run: |
        [ -d ~/.konan ] || exit 0
        find ~/.konan -mindepth 1 -maxdepth 1 -name 'kotlin-native-prebuilt-*' ! -name "kotlin-native-prebuilt-*-${KOTLIN_VERSION}" -print -exec rm -rf {} +

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        cache-read-only: ${{ inputs.cache_read_only }}
        cache-encryption-key: ${{ inputs.gradle_encryption_key }}
        develocity-access-key: ${{ inputs.develocity_access_key }}
        # Cache cleanup is broken on Windows with setup-gradle v6's "enhanced
        # caching" provider: it deletes the whole Gradle User Home instead of
        # just unused entries (1739 files "excluded from the cache" here vs 25
        # on Linux), so every subsequent save fails path validation and the
        # Windows cache is never written. Upstream: gradle/actions#1013.
        # Skip cleanup there — a slightly larger cache beats no cache at all.
        cache-cleanup: ${{ runner.os == 'Windows' && 'never' || 'on-success' }}
        add-job-summary: always
        # Windows-only: the post step exits while the octokit sockets from comment
        # minimization are still live, and Node 24.18.0 aborts in libuv teardown
        # there (nodejs/node#56645), failing jobs whose build already passed.
        # Nothing else in this post step does HTTP on a PR — the cache is
        # read-only off main and dependency-graph defaults to disabled.
        add-job-summary-as-pr-comment: ${{ runner.os == 'Windows' && 'never' || inputs.job_summary_pr_comment }}
        dependency-graph: ${{ inputs.dependency_graph }}
        gradle-home-cache-includes: |
          caches
          notifications
        # `caches` sweeps in caches/build-cache-1, the LOCAL build cache — which since the
        # Develocity onboarding (#6531) duplicates the remote cache at
        # community.develocity.cloud. Shipping both means paying tarball upload/download
        # for entries the remote already serves, on every one of the ~14 jobs that call
        # this action, against a 10 GB repo-wide Actions cache quota that evicts under
        # pressure. Dependency and transform caches (the expensive part) still ship.
        # Effect is measurable in the Build Scan cache-performance view; revert if remote
        # cache latency turns out to cost more than the restore it replaced.
        gradle-home-cache-excludes: |
          caches/build-cache-1
