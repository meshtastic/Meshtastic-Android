distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# -bin, not -all: the docs/sources in -all serve no one (IDEs fetch sources on demand)
# and cost ~70 MB per cold runner. Checksum from the official .sha256 next to the
# distribution — update BOTH lines together on Gradle upgrades (Renovate edits the
# URL; a stale checksum fails the download with a clear message).
distributionSha256Sum=9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
networkTimeout=30000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
