distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# -bin: nothing here reads -all's docs/sources. Update sha256 with the URL on upgrades
# (official .sha256 sits next to the distribution; renovate does both).
# On 9.7.1 again after the #6786 pin-back. Both of that revert's blockers must stay dead
# on any future 9.7+ bump: the CC fingerprint crashing on reload of its own same-key entry
# (IsInIdeaSyncValueSource CNFE in the settings-plugin scope), and CMP's Windows packaging
# tripping an Isolated Projects violation (':desktopApp' cannot access Project.layout on
# ':'). The first only shows on a CC cache-key HIT, so one green run does not clear it.
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
networkTimeout=30000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
