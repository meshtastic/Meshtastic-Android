distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# -bin: nothing here reads -all's docs/sources. Update sha256 with the URL on upgrades
# (official .sha256 sits next to the distribution; renovate does both).
# Every bump must keep two failures dead: the CC fingerprint crashing on reload of its own
# same-key entry (IsInIdeaSyncValueSource CNFE in the settings-plugin scope), and CMP's Windows
# packaging tripping an Isolated Projects violation (':desktopApp' cannot access Project.layout
# on ':'). The first shows only on a configuration-cache hit, and CI keeps no configuration
# cache between runs, so check it locally by running the same build twice.
distributionSha256Sum=ef02c92a61020a0e4e0cfe2c8d6e00235538e0109e50364dd40f2065a267add3
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-rc-1-bin.zip
networkTimeout=30000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
